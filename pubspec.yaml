name: antigravity_usage_indicator
description: "A floating Windows desktop utility indicator for Google Antigravity and Gemini quota usage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  window_manager: ^0.4.3
  screen_retriever: ^0.2.2
  tray_manager: ^0.2.4
  launch_at_startup: ^0.5.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
